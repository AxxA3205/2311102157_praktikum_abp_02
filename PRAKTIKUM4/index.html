<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas AJAX</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0d1117;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .terminal {
        background: #0d1117;
        border: 0.5px solid #30363d;
        border-radius: 12px;
        overflow: hidden;
        width: 560px;
      }

      .titlebar {
        background: #161b22;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 0.5px solid #30363d;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot.r {
        background: #ff5f56;
      }
      .dot.y {
        background: #ffbd2e;
      }
      .dot.g {
        background: #27c93f;
      }

      .title-text {
        color: #8b949e;
        font-size: 12px;
        margin-left: 8px;
      }

      .body {
        padding: 24px;
      }

      .label {
        color: #8b949e;
        font-size: 11px;
        margin-bottom: 8px;
      }

      .prompt {
        color: #58a6ff;
        font-size: 13px;
        margin-bottom: 20px;
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 14px;
        background: #27c93f;
        animation: blink 1s infinite;
        vertical-align: middle;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      button {
        background: transparent;
        border: 1px solid #27c93f;
        color: #27c93f;
        padding: 10px 20px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: rgba(39, 201, 63, 0.1);
      }

      #loading {
        color: #8b949e;
        font-size: 12px;
        margin-top: 12px;
        display: none;
      }

      #hasil-profil {
        margin-top: 20px;
        background: #161b22;
        border-radius: 8px;
        border: 0.5px solid #30363d;
        padding: 16px;
        display: none;
      }

      .result-line {
        color: #e6edf3;
        font-size: 13px;
        line-height: 1.9;
      }

      .key {
        color: #79c0ff;
      }
      .val {
        color: #a5d6ff;
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="titlebar">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
        <span class="title-text">ajax-task — index.html</span>
      </div>
      <div class="body">
        <div class="label">
          // Tugas Modul AJAX | Mahija Danadyaksa Sadtomo | 2311102157
        </div>
        <div class="prompt">
          $ Klik tombol untuk fetch data dari server
          <span class="cursor"></span>
        </div>

        <button onclick="tampilkanProfil()">&#9654; Tampilkan Profil</button>

        <div id="loading">&#9632; Mengambil data dari server...</div>

        <div id="hasil-profil">
          <div class="result-line">
            <span class="key">Nama</span>: <span class="val" id="nama"></span>
          </div>
          <div class="result-line">
            <span class="key">Pekerjaan</span>:
            <span class="val" id="pekerjaan"></span>
          </div>
          <div class="result-line">
            <span class="key">Lokasi</span>:
            <span class="val" id="lokasi"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      function tampilkanProfil() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("hasil-profil").style.display = "none";

        fetch("data.php")
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            document.getElementById("nama").textContent = data.nama;
            document.getElementById("pekerjaan").textContent = data.pekerjaan;
            document.getElementById("lokasi").textContent = data.lokasi;

            document.getElementById("loading").style.display = "none";
            document.getElementById("hasil-profil").style.display = "block";
          })
          .catch(function (error) {
            document.getElementById("loading").textContent =
              "Gagal mengambil data.";
            console.error("Error:", error);
          });
      }
    </script>
  </body>
</html>
