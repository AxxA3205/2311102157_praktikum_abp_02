name: todo_fcm_app
description: "A practicum To-Do app using Provider and Firebase Cloud Messaging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Core — Required by all Firebase plugins
  firebase_core: ^3.6.0

  # Firebase Cloud Messaging — Push Notifications
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
